name: OMA Docker Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: oma-docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/openmarketing-agency/oma-agent
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build:
    name: Build and smoke-test (${{ matrix.arch }})
    if: github.repository == 'openmarketing-agency/oma-agent'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Docker tag and stamp the release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [ "${#GITHUB_REF_NAME}" -gt 128 ]; then
            printf '::error::Expected a Docker-compatible version tag such as v0.1.0, got %s\n' "$GITHUB_REF_NAME"
            exit 1
          fi
          python3 scripts/ci/check_profile_archive_boundary.py
          python3 scripts/write_install_stamp.py --output install-stamp.json \
            --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" \
            --base-version "${GITHUB_REF_NAME#v}" --display-version "${GITHUB_REF_NAME#v}" \
            --distance 0 --distribution docker --update-mechanism external --source ci

      - name: Free runner disk for the full application image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            HERMES_BOT_DESKTOP=0
          labels: |
            org.opencontainers.image.title=oma-agent
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=oma-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=oma-docker-${{ matrix.arch }}

      - name: Smoke-test release identity and CLI
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "${IMAGE_NAME}:test" --format '{{.Architecture}}')" = "$ARCH"
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python \
            -e EXPECTED_COMMIT="$GITHUB_SHA" -e EXPECTED_VERSION="${GITHUB_REF_NAME#v}" \
            -e EXPECTED_IMAGE="$IMAGE_NAME" "${IMAGE_NAME}:test" -c \
            'import json, os; from pathlib import Path; stamp = json.loads(Path("/opt/hermes/install-stamp.json").read_text()); marker = json.loads(Path("/etc/hermes/image-provenance.json").read_text()); assert stamp["commit"] == os.environ["EXPECTED_COMMIT"]; assert stamp["baseVersion"] == os.environ["EXPECTED_VERSION"]; assert marker["image"] == os.environ["EXPECTED_IMAGE"]; assert marker["version"] == os.environ["EXPECTED_VERSION"]; assert marker["revision"] == os.environ["EXPECTED_COMMIT"]; import run_agent; print("Release identity and agent import OK")'
          docker run --rm --network none "${IMAGE_NAME}:test" --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the tested build's local layers; no mutable release tag yet.
      - name: Push tested image by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            HERMES_BOT_DESKTOP=0
          labels: |
            org.opencontainers.image.title=oma-agent
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Record architecture digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oma-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish versioned multi-architecture image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oma-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify the release manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            images+=("${IMAGE_NAME}@sha256:${digest}")
          done
          test "${#images[@]}" -eq 2
          ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker buildx imagetools create --tag "$ref" "${images[@]}"
          docker buildx imagetools inspect "$ref" --raw > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = {f"sha256:{path.name}" for path in pathlib.Path.cwd().iterdir()}
          images = [row for row in manifest["manifests"] if row.get("platform", {}).get("os") == "linux"]
          assert {row["digest"] for row in images} == expected
          assert {row["platform"]["architecture"] for row in images} == {"amd64", "arm64"}
          print("Verified both tested architecture digests in release manifest")
          PY
          docker buildx imagetools inspect "$ref" | tee "$RUNNER_TEMP/image-inspect.txt"
          {
            printf '## OMA Docker release\n\n`%s`\n\n' "$ref"
            printf 'Platforms: `linux/amd64`, `linux/arm64`\n\nSource: `%s`\n\n```text\n' "$GITHUB_SHA"
            cat "$RUNNER_TEMP/image-inspect.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
